name: testvibe-gate
description: >-
  Reusable S0 pre-merge CI gate for testvibe — installs dev deps, runs ruff +
  mypy, then the hermetic test subset (live/dogfood quarantined, benchmarks
  disabled) with tool-specific env vars scrubbed so the gate matches CI reality
  rather than the dev shell (the SYNCESTRA_* leak class).

inputs:
  scrub-env:
    description: >-
      Env-var prefix to scrub from the gate run (e.g. "SYNCESTRA_"). Every
      variable whose name starts with this prefix is unset before the test step
      runs, so a leftover dev-shell secret cannot cause a false gate failure.
    type: string
    default: ""

runs:
  using: composite
  steps:
    - name: Install dev dependencies
      shell: bash
      run: uv sync --extra dev

    - name: Lint (ruff)
      shell: bash
      run: ruff check .

    - name: Type-check (mypy)
      shell: bash
      # Type the shipped package. A bare `mypy` errors with no target; `src`
      # is where the package lives (src/testvibe layout).
      run: mypy src

    - name: Scrub tool-specific env and run the hermetic suite
      shell: bash
      env:
        # Expand the scrub-env input into a var the step can read.
        TESTVIBE_SCRUB_ENV: ${{ inputs.scrub-env }}
      run: |
        # Drop any env var whose name starts with the configured prefix so the
        # gate matches CI reality, not the dev shell (mirrors `env -u PREFIX_*`).
        if [ -n "$TESTVIBE_SCRUB_ENV" ]; then
          for var in $(compgen -v | grep "^$TESTVIBE_SCRUB_ENV" || true); do
            unset "$var"
          done
        fi
        pytest -m "not live and not dogfood" --benchmark-disable

    - name: Self-dogfood suite (testvibe testing itself)
      shell: bash
      env:
        TESTVIBE_SCRUB_ENV: ${{ inputs.scrub-env }}
      run: |
        # The self-dogfood scenarios/ suite (S0–S7 + S4b MCP round-trip) —
        # testvibe's own @scenario tests exercising testvibe. Isolated from the
        # unit gate by testpaths=["tests"]; invoked explicitly here. Hermetic
        # scenarios run; canary/dogfood kinds are skip-marked (-m filter keeps
        # the gate's "not live and not dogfood" contract).
        if [ -n "$TESTVIBE_SCRUB_ENV" ]; then
          for var in $(compgen -v | grep "^$TESTVIBE_SCRUB_ENV" || true); do
            unset "$var"
          done
        fi
        pytest scenarios/ -m "not live and not dogfood" -q
