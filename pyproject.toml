[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "testvibe"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "detect-secrets>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
mcp = ["fastmcp>=2.0"]
fuzz = ["hypothesis>=6.0", "pytest>=8.0"]

[project.scripts]
testvibe = "testvibe.cli:main"

[project.entry-points.pytest11]
testvibe = "testvibe.plugin"

[tool.hatch.version]
source = "vcs"
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/testvibe"]

# ---- lint / type gate -------------------------------------------------------
[tool.ruff]
line-length = 100
extend-exclude = [
    ".claude",        # transient agent worktrees, not shipped source
    ".benchmarks",    # generated benchmark snapshots
    ".hypothesis",    # generated hypothesis examples
    "dist",           # build output
    "docs",
    "skills",
]

[tool.ruff.lint]
# Professional, modern rule set: pycodestyle + pyflakes + isort + pyupgrade +
# bugbear + comprehensions + simplify + ruff-specific.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # subprocess-run-without-check: testvibe intentionally runs pytest as a
    # subprocess and parses the return code itself (check=False is the correct
    # semantics; a CalledProcessError would defeat the gate).
    "PLW1510",
    # subprocess call on a trusted, intentional invocation.
    "S603",
    # partial executable path (sys.executable): intentional and trusted.
    "S607",
    # date.today(): testvibe only uses it to stamp a discovered-at field; no
    # timezone-relevant semantics.
    "DTZ011",
]

[tool.mypy]
strict = false
warn_unreachable = true
# Third-party libs without stubs (e.g. detect-secrets) fall back to Any so the
# gate fails on real type bugs in testvibe itself, not on missing upstream types.
ignore_missing_imports = true

# ---- pytest isolation -------------------------------------------------------
# Keep the self-dogfood ``scenarios/`` suite OFF the default gate: a bare
# ``pytest`` from the repo root collects ONLY ``tests/`` (the 95-test unit
# suite), so the dogfood scenarios can only run via an explicit
# ``pytest scenarios/`` invocation. This also keeps the plugin's global
# ``known-failures.yaml`` collector from ever walking scenarios/ at gate time.
[tool.pytest.ini_options]
testpaths = ["tests"]
